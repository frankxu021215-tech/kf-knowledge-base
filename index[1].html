<style>
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --ink: #1a1a2e;
    --muted: #6b7280;
    --rule: #e5e7eb;
    --accent: #2563eb;
    --accent2: #f59e0b;
    --danger: #ef4444;
    --success: #10b981;
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans CJK SC", "WenQuanYi Micro Hei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    font-size: 15px;
  }

  /* Login Overlay */
  .login-overlay {
    position: fixed; inset: 0; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    z-index: 500; display: flex; align-items: center; justify-content: center; padding: 1rem;
  }
  .login-box {
    background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 420px;
    padding: 2.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35); text-align: center;
  }
    .login-box .logo-img { height: 80px; margin-bottom: 1rem; }
  .logo-text {
    display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    color: #fff; font-weight: 700; letter-spacing: 1px;
    border-radius: var(--radius); user-select: none;
  }
  .login-box .logo-text { font-size: 2rem; padding: 0.6rem 1.2rem; margin-bottom: 1rem; }
  .brand .logo-text { font-size: 1.1rem; padding: 0.35rem 0.7rem; margin-right: 0.5rem; }
  .login-box h2 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  .login-box p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .login-form { display: flex; flex-direction: column; gap: 0.75rem; text-align: left; }
  .login-form input {
    padding: 0.7rem 1rem; border: 1px solid var(--rule); border-radius: var(--radius);
    font-size: 0.95rem; outline: none;
  }
  .login-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
  .login-actions { display: flex; gap: 0.75rem; margin-top: 0.5rem; }
  .login-actions .btn { flex: 1; justify-content: center; padding: 0.7rem; }
  .login-box .btn-secondary { background: var(--bg); color: var(--ink); border: 1px solid var(--rule); }
  .login-box .btn-secondary:hover { background: var(--rule); }

  /* Header */
  .app-header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff; padding: 0.75rem 2rem; display: flex; align-items: center;
    justify-content: space-between; flex-wrap: wrap; gap: 1rem;
    position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow);
  }
  .brand { display: flex; align-items: center; gap: 0.75rem; }
  .brand img { height: 40px; width: auto; border-radius: 4px; background: #fff; padding: 2px; }
  .brand h1 { font-size: 1.15rem; font-weight: 600; letter-spacing: 0.5px; }
  .brand span { font-size: 0.75rem; opacity: 0.7; display: block; }
  .header-right { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  .user-badge {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.35rem 0.75rem; background: rgba(255,255,255,0.1);
    border-radius: 999px; font-size: 0.8rem;
  }
  .user-badge.admin { background: rgba(16,185,129,0.2); color: #6ee7b7; }
  .user-badge.guest { background: rgba(245,158,11,0.2); color: #fcd34d; }

  .btn {
    display: inline-flex; align-items: center; gap: 0.35rem;
    padding: 0.5rem 1rem; border-radius: var(--radius); border: none; cursor: pointer;
    font-size: 0.875rem; font-weight: 500; transition: all 0.2s; white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-secondary { background: rgba(255,255,255,0.12); color: #fff; }
  .btn-secondary:hover { background: rgba(255,255,255,0.2); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { background: #059669; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--rule); }
  .btn-ghost:hover { background: var(--bg); }
  .btn-sm { padding: 0.35rem 0.65rem; font-size: 0.8rem; }

  /* Stats bar */
  .stats-bar {
    display: flex; gap: 1.5rem; padding: 0.75rem 2rem; background: var(--surface);
    border-bottom: 1px solid var(--rule); flex-wrap: wrap; font-size: 0.85rem;
  }
  .stat-item { display: flex; align-items: center; gap: 0.35rem; color: var(--muted); }
  .stat-item strong { color: var(--ink); font-size: 1rem; }

  /* Search Section */
  .search-section {
    padding: 1.25rem 2rem; background: var(--surface); border-bottom: 1px solid var(--rule);
  }
  .search-row {
    display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.75rem;
  }
  .search-input-wrap { flex: 1; min-width: 240px; position: relative; }
  .search-input-wrap input {
    width: 100%; padding: 0.6rem 2.5rem 0.6rem 0.9rem; border: 1px solid var(--rule);
    border-radius: var(--radius); font-size: 0.9rem; outline: none;
  }
  .search-input-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
  .search-input-wrap .clear-btn {
    position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; display: none;
  }
  .search-mode {
    display: flex; background: var(--bg); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--rule);
  }
  .search-mode button {
    padding: 0.55rem 0.85rem; border: none; background: none; cursor: pointer; font-size: 0.8rem; color: var(--muted);
    border-right: 1px solid var(--rule); transition: all 0.2s;
  }
  .search-mode button:last-child { border-right: none; }

<script>
// ==================== Auth System ====================
// ==================== Firebase Config ====================
// 请替换为你自己的 Firebase 配置（详见部署指南）
const firebaseConfig = {
  apiKey: "AIzaSyCp9hmPaUEE6rzYYw9JqWajW9kFxhrbikc",
  authDomain: "kf-concept-kb.firebaseapp.com",
  databaseURL: "https://kf-concept-kb-default-rtdb.firebaseio.com",
  projectId: "kf-concept-kb",
  storageBucket: "kf-concept-kb.firebasestorage.app",
  messagingSenderId: "473066962657",
  appId: "1:473066962657:web:74186e185edf9d82f301a0"
};

try { firebase.initializeApp(firebaseConfig); } catch(e) {}
const db = firebase.database ? firebase.database() : null;

// ==================== Room Manager ====================
const roomManager = {
  getRoomId() {
    const params = new URLSearchParams(location.search);
    const urlRoom = params.get('room');
    if (urlRoom) {
      const clean = urlRoom.trim().replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 30);
      if (clean) { localStorage.setItem('zhuor_kb_room', clean); return clean; }
    }
    return localStorage.getItem('zhuor_kb_room') || 'default';
  },
  setRoomId(id) {
    const clean = id.trim().replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 30);
    if (!clean) return false;
    localStorage.setItem('zhuor_kb_room', clean);
    return true;
  },
  getRef(path) {
    if (!db) return null;
    return db.ref('rooms/' + this.getRoomId() + '/' + path);
  },
  get isConnected() { return !!db; }
};

// ==================== Sync Engine ====================
const sync = {
  listeners: [],

  watchEntries(callback) {
    if (!db) return;
    const ref = roomManager.getRef('entries');
    ref.off();
    ref.on('value', snapshot => {
      const val = snapshot.val();
      callback(val ? Object.values(val) : []);
    });
    this.listeners.push(ref);
  },

  watchFields(callback) {
    if (!db) return;
    const ref = roomManager.getRef('fields');
    ref.off();
    ref.on('value', snapshot => {
      callback(snapshot.val() || null);
    });
    this.listeners.push(ref);
  },

  watchAdmin(callback) {
    if (!db) return;
    const ref = roomManager.getRef('admin');
    ref.off();
    ref.on('value', snapshot => {
      callback(snapshot.val() || {});
    });
    this.listeners.push(ref);
  },

  saveEntries(dataArray) {
    if (!db) return Promise.resolve();
    const obj = {};
    dataArray.forEach(item => { if (item.id) obj[item.id] = item; });
    return roomManager.getRef('entries').set(obj);
  },

  saveFields(data) {
    if (!db) return Promise.resolve();
    return roomManager.getRef('fields').set(data);
  },

  saveAdmin(data) {
    if (!db) return Promise.resolve();
    return roomManager.getRef('admin').set(data);
  },

  disconnect() {
    this.listeners.forEach(ref => ref.off());
    this.listeners = [];
  }
};

    priority: "中", source: "产品测试报告", updatedAt: "2024-06-20", notes: "安全问题需正面回应，避免敷衍。提供数据背书最有效。"
  }
];

// ==================== App ====================
const app = {
  data: [],
  filtered: [],
  page: 1,
  perPage: 12,
  mode: 'keyword',
  currentId: null,

  init() {
    // 先加载本地默认数据作为 fallback
    const saved = localStorage.getItem('zhuor_kb_data');
    this.data = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultData));
    config.refreshAll();
    auth.init();
    this.render();
    this.updateStats();

    // 如果 Firebase 未配置，显示提示
    if (!db) {
      this.showToast('⚠️ Firebase 未配置，数据仅保存在本地', 'error');
      return;
    }

    // 显示当前房间号
    this.updateRoomDisplay();

    // 监听云端数据变化（实时同步）
    sync.watchEntries(entries => {
      this.data = entries.length ? entries : this.data;
      this.render();
      this.updateStats();
    });

    sync.watchFields(fields => {
      if (fields) {
        localStorage.setItem('zhuor_kb_fields', JSON.stringify(fields));
        config.refreshAll();
      }
    });

    sync.watchAdmin(admin => {
      if (admin && admin.user) localStorage.setItem('zhuor_kb_admin_user', admin.user);
      if (admin && admin.pass) localStorage.setItem('zhuor_kb_admin_pass', admin.pass);
    });

    this.showToast('✅ 已连接云端，数据实时同步中', 'success');
  },

  saveStorage() {
    localStorage.setItem('zhuor_kb_data', JSON.stringify(this.data));
    sync.saveEntries(this.data);
    this.updateStats();
  },

  updateStats() {
    document.getElementById('statTotal').textContent = this.data.length;
    const now = new Date();
    const thisMonth = this.data.filter(d => {
      const dt = new Date(d.updatedAt);
      return dt.getMonth() === now.getMonth() && dt.getFullYear() === now.getFullYear();
    }).length;
    document.getElementById('statMonth').textContent = thisMonth;
    document.getElementById('statHigh').textContent = this.data.filter(d => d.priority === '高').length;
    document.getElementById('statFilter').textContent = this.filtered.length;
  },

  setMode(btn) {
    document.querySelectorAll('.search-mode button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    this.mode = btn.dataset.mode;
    this.page = 1;
    this.render();
  },

  onSearchInput() {
    const val = document.getElementById('searchInput').value;
    document.getElementById('clearSearch').style.display = val ? 'flex' : 'none';
    this.page = 1;
    this.render();
  },

  clearSearch() {
    document.getElementById('searchInput').value = '';
    document.getElementById('clearSearch').style.display = 'none';
    this.page = 1;
    this.render();
  },

  resetFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('clearSearch').style.display = 'none';
    document.getElementById('searchScope').value = 'all';
    document.getElementById('filterCategory').value = '';
    document.getElementById('filterType').value = '';
    document.getElementById('filterPriority').value = '';
    document.getElementById('filterPlatform').value = '';
    this.page = 1;
    this.render();
  },

  getSearchText(item, scope) {
    switch(scope) {
      case 'title': return (item.title || '').toLowerCase();
      case 'asin': return (item.asin || '').toLowerCase();
      case 'product': return ((item.productName || '') + ' ' + (item.model || '')).toLowerCase();
      case 'brand': return (item.brand || '').toLowerCase();
      case 'answer': return (item.answer || '').toLowerCase();
      case 'tags': return (item.tags || []).join(' ').toLowerCase();
      case 'notes': return (item.notes || '').toLowerCase();
      default: // all
        return (
          (item.title || '') + ' ' +
          (item.question || '') + ' ' +
          (item.answer || '') + ' ' +
          (item.productName || '') + ' ' +
          (item.model || '') + ' ' +
          (item.brand || '') + ' ' +
          (item.asin || '') + ' ' +
          (item.category || '') + ' ' +
          (item.questionType || '') + ' ' +
          (item.platform || '') + ' ' +
          (item.source || '') + ' ' +
          (item.relatedProducts || '') + ' ' +
          (item.techSpecs || '') + ' ' +
          (item.misconceptions || '') + ' ' +
          (item.notes || '') + ' ' +
          (item.tags || []).join(' ')
        ).toLowerCase();
    }
  },

  matchesSearch(item, query) {
    if (!query) return true;
    const scope = document.getElementById('searchScope').value;
    const q = query.toLowerCase().trim();
    const text = this.getSearchText(item, scope);

    if (this.mode === 'exact') {
      return text.includes(q);
    }
    if (this.mode === 'fuzzy') {
      const chars = q.split('');
      let idx = 0;
      for (let c of chars) {
        idx = text.indexOf(c, idx);
        if (idx === -1) return false;
        idx++;
      }
      return true;
    }
    // keyword mode
    const words = q.split(/\s+/).filter(w => w);
    return words.every(w => text.includes(w));
  },

  render() {
    const query = document.getElementById('searchInput').value;
    const cat = document.getElementById('filterCategory').value;
    const type = document.getElementById('filterType').value;
    const pri = document.getElementById('filterPriority').value;
    const plat = document.getElementById('filterPlatform').value;

    this.filtered = this.data.filter(item => {
      if (cat && item.category !== cat) return false;
      if (type && item.questionType !== type) return false;
      if (pri && item.priority !== pri) return false;
      if (plat && item.platform !== plat) return false;
      return this.matchesSearch(item, query);
    });

    this.filtered.sort((a, b) => {
      const pMap = { '高': 3, '中': 2, '低': 1 };
      if (pMap[b.priority] !== pMap[a.priority]) return pMap[b.priority] - pMap[a.priority];
      return new Date(b.updatedAt) - new Date(a.updatedAt);
    });

    const container = document.getElementById('cardContainer');
    const empty = document.getElementById('emptyState');

    if (this.filtered.length === 0) {
      container.innerHTML = '';
      empty.style.display = 'block';
      document.getElementById('pagination').innerHTML = '';
      this.updateStats();
      return;
    }
    empty.style.display = 'none';

    const start = (this.page - 1) * this.perPage;
    const pageItems = this.filtered.slice(start, start + this.perPage);

    container.innerHTML = pageItems.map(item => {
      const badgePri = `badge-priority-${item.priority === '高' ? 'high' : item.priority === '中' ? 'medium' : 'low'}`;
      const tagsHtml = (item.tags || []).slice(0, 4).map(t => `<span class="tag-pill">${this.escapeHtml(t)}</span>`).join('');
      const showActions = auth.isAdmin() ? '' : 'style="display:none;"';
      return `
        <div class="kb-card" onclick="app.openDetail('${item.id}')">
          <div class="kb-card-actions" onclick="event.stopPropagation()" ${showActions}>
            <button class="icon-btn" onclick="app.openForm('${item.id}')" title="编辑">&#9998;</button>
            <button class="icon-btn" onclick="app.deleteItem('${item.id}')" title="删除">&#128465;</button>
          </div>
          <div class="kb-card-header">
            <div class="kb-card-badges">
              <span class="badge badge-cat">${this.escapeHtml(item.category)}</span>
              <span class="badge badge-type">${this.escapeHtml(item.questionType)}</span>
              <span class="badge ${badgePri}">${item.priority}</span>
              ${item.asin ? `<span class="badge" style="background:#f3f4f6;color:#374151;">ASIN</span>` : ''}
            </div>
          </div>
          <div class="kb-card-title">${this.highlightSearch(this.escapeHtml(item.title))}</div>
          <div class="kb-card-meta">
            ${this.escapeHtml(item.brand || '')} ${this.escapeHtml(item.productName)}
            ${item.model ? '(' + this.escapeHtml(item.model) + ')' : ''}
            ${item.asin ? '· ASIN:' + this.escapeHtml(item.asin) : ''}
            · ${item.platform}
          </div>
          <div class="kb-card-preview">${this.escapeHtml((item.answer || '').substring(0, 120))}...</div>
          <div class="kb-card-tags">${tagsHtml}</div>
        </div>
      `;
    }).join('');

    this.renderPagination();
    this.updateStats();
  },

  renderPagination() {
    const totalPages = Math.ceil(this.filtered.length / this.perPage);
    const el = document.getElementById('pagination');
    if (totalPages <= 1) { el.innerHTML = ''; return; }

    let html = `<button onclick="app.goPage(${this.page - 1})" ${this.page === 1 ? 'disabled' : ''}>&lt;</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= this.page - 1 && i <= this.page + 1)) {
        html += `<button class="${i === this.page ? 'active' : ''}" onclick="app.goPage(${i})">${i}</button>`;
      } else if (i === this.page - 2 || i === this.page + 2) {
        html += `<span style="padding:0 0.3rem;color:var(--muted)">...</span>`;
      }
    }
    html += `<button onclick="app.goPage(${this.page + 1})" ${this.page === totalPages ? 'disabled' : ''}>&gt;</button>`;
    el.innerHTML = html;
  },

  goPage(p) {
    const total = Math.ceil(this.filtered.length / this.perPage);
    if (p < 1 || p > total) return;
    this.page = p;
    this.render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  },

  escapeHtml(text) {
    if (!text) return '';
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  },

  highlightSearch(text) {
    const query = document.getElementById('searchInput').value.trim();
    if (!query || this.mode === 'fuzzy') return text;
    const words = query.split(/\s+/).filter(w => w);
    let result = text;
    words.forEach(w => {
      const re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      result = result.replace(re, '<mark style="background:#fef08a;padding:0 2px;border-radius:2px;">$1</mark>');
    });
    return result;
  },

  openDetail(id) {
    const item = this.data.find(d => d.id === id);
    if (!item) return;
    this.currentId = id;
    const body = document.getElementById('detailBody');
    const badgePri = `badge-priority-${item.priority === '高' ? 'high' : item.priority === '中' ? 'medium' : 'low'}`;
    const editBtn = document.getElementById('detailEditBtn');
    if (editBtn) editBtn.style.display = auth.isAdmin() ? 'inline-flex' : 'none';

    body.innerHTML = `
      <div class="detail-section">
        <div class="kb-card-badges" style="margin-bottom:0.75rem;">
          <span class="badge badge-cat">${this.escapeHtml(item.category)}</span>
          <span class="badge badge-type">${this.escapeHtml(item.questionType)}</span>
          <span class="badge ${badgePri}">${item.priority}</span>
          <span class="badge" style="background:var(--bg);color:var(--muted);">${this.escapeHtml(item.platform)}</span>
        </div>
        <h3 style="font-size:1.15rem;margin-bottom:0.5rem;">${this.escapeHtml(item.title)}</h3>
      </div>
      <div class="detail-section">
        <h4>产品信息</h4>
        <div class="detail-meta-grid">
          <div class="detail-meta-item"><label>品牌/系列</label>${this.escapeHtml(item.brand || '-')}</div>
          <div class="detail-meta-item"><label>产品名称</label>${this.escapeHtml(item.productName)}</div>
          <div class="detail-meta-item"><label>型号/SKU</label>${this.escapeHtml(item.model || '-')}</div>
          <div class="detail-meta-item"><label>ASIN</label>${this.escapeHtml(item.asin || '-')}</div>
          <div class="detail-meta-item"><label>更新日期</label>${this.escapeHtml(item.updatedAt)}</div>
          <div class="detail-meta-item"><label>引用来源</label>${this.escapeHtml(item.source || '-')}</div>
        </div>
      </div>
      ${item.techSpecs ? `<div class="detail-section"><h4>技术参数要点</h4><div style="background:var(--bg);padding:0.75rem 1rem;border-radius:6px;font-size:0.9rem;">${this.escapeHtml(item.techSpecs)}</div></div>` : ''}
      ${item.question ? `<div class="detail-section"><h4>问题详情</h4><p>${this.escapeHtml(item.question).replace(/\n/g, '<br>')}</p></div>` : ''}
      <div class="detail-section">
        <h4>标准回复 / 话术</h4>
        <div class="answer-box">${this.escapeHtml(item.answer)}</div>
        <button class="btn btn-sm btn-ghost" style="margin-top:0.5rem;" onclick="app.copyAnswer()">复制回复内容</button>
      </div>
      ${item.misconceptions ? `<div class="detail-section"><h4>常见误区</h4><div style="background:#fffbeb;border-left:3px solid var(--accent2);padding:0.75rem 1rem;border-radius:0 6px 6px 0;font-size:0.9rem;">${this.escapeHtml(item.misconceptions)}</div></div>` : ''}
      ${item.relatedProducts ? `<div class="detail-section"><h4>相关配件 / 兼容产品</h4><p>${this.escapeHtml(item.relatedProducts)}</p></div>` : ''}
      ${item.tags && item.tags.length ? `<div class="detail-section"><h4>标签</h4><div class="kb-card-tags">${item.tags.map(t => `<span class="tag-pill">${this.escapeHtml(t)}</span>`).join('')}</div></div>` : ''}
      ${item.notes ? `<div class="detail-section"><h4>备注</h4><p style="color:var(--muted);font-size:0.9rem;">${this.escapeHtml(item.notes)}</p></div>` : ''}
    `;
    document.getElementById('detailModal').classList.add('active');
  },

  closeDetail() {
    document.getElementById('detailModal').classList.remove('active');
    this.currentId = null;
  },

  copyAnswer() {
    const item = this.data.find(d => d.id === this.currentId);
    if (!item) return;
    navigator.clipboard.writeText(item.answer).then(() => this.showToast('回复内容已复制到剪贴板', 'success'));
  },

  openForm(id) {
    if (!auth.isAdmin()) { this.showToast('访客无权编辑', 'error'); return; }
    const isEdit = !!id;
    document.getElementById('formTitle').textContent = isEdit ? '编辑知识点' : '新增知识点';
    const item = isEdit ? this.data.find(d => d.id === id) : null;

    document.getElementById('fId').value = item ? item.id : '';
    document.getElementById('fCategory').value = item ? item.category : '';
    document.getElementById('fBrand').value = item ? item.brand : '';
    document.getElementById('fProductName').value = item ? item.productName : '';
    document.getElementById('fModel').value = item ? item.model : '';
    document.getElementById('fAsin').value = item ? item.asin : '';
    document.getElementById('fPlatform').value = item ? item.platform : 'Amazon';
    document.getElementById('fQuestionType').value = item ? item.questionType : '';
    document.getElementById('fPriority').value = item ? item.priority : '中';
    document.getElementById('fTitle').value = item ? item.title : '';
    document.getElementById('fQuestion').value = item ? item.question : '';
    document.getElementById('fAnswer').value = item ? item.answer : '';
    document.getElementById('fTags').value = item ? item.tags.join(', ') : '';
    document.getElementById('fRelated').value = item ? item.relatedProducts : '';
    document.getElementById('fSource').value = item ? item.source : '';
    document.getElementById('fTechSpecs').value = item ? item.techSpecs : '';
    document.getElementById('fMisconceptions').value = item ? item.misconceptions : '';
    document.getElementById('fNotes').value = item ? item.notes : '';

    document.getElementById('formModal').classList.add('active');
  },

  closeForm() {
    document.getElementById('formModal').classList.remove('active');
  },

  saveForm() {
    const id = document.getElementById('fId').value;
    const category = document.getElementById('fCategory').value.trim();
    const productName = document.getElementById('fProductName').value.trim();
    const title = document.getElementById('fTitle').value.trim();
    const answer = document.getElementById('fAnswer').value.trim();
    const questionType = document.getElementById('fQuestionType').value.trim();

    if (!category || !productName || !title || !answer || !questionType) {
      this.showToast('请填写所有带 * 的必填项', 'error');
      return;
    }

    const tags = document.getElementById('fTags').value.split(/[,，]/).map(t => t.trim()).filter(t => t);
    const now = new Date().toISOString().split('T')[0];

    const payload = {
      id: id || ('kb-' + Date.now().toString(36)),
      category,
      brand: document.getElementById('fBrand').value.trim(),
      productName,
      model: document.getElementById('fModel').value.trim(),
      asin: document.getElementById('fAsin').value.trim(),
      platform: document.getElementById('fPlatform').value,
      questionType,
      title,
      question: document.getElementById('fQuestion').value.trim(),
      answer,
      tags,
      relatedProducts: document.getElementById('fRelated').value.trim(),
      source: document.getElementById('fSource').value.trim(),
      techSpecs: document.getElementById('fTechSpecs').value.trim(),
      misconceptions: document.getElementById('fMisconceptions').value.trim(),
      priority: document.getElementById('fPriority').value,
      updatedAt: now,
      notes: document.getElementById('fNotes').value.trim()
    };

    if (id) {
      const idx = this.data.findIndex(d => d.id === id);
      if (idx !== -1) this.data[idx] = payload;
    } else {
      this.data.unshift(payload);
    }

    this.saveStorage();
    this.render();
    this.closeForm();
    this.showToast(id ? '知识点已更新' : '知识点已添加', 'success');
  },

  editCurrent() {
    if (!auth.isAdmin()) { this.showToast('访客无权编辑', 'error'); return; }
    if (this.currentId) {
      this.closeDetail();
      setTimeout(() => this.openForm(this.currentId), 200);
    }
  },

  deleteItem(id) {
    if (!auth.isAdmin()) { this.showToast('访客无权删除', 'error'); return; }
    if (!confirm('确定要删除这条知识吗？此操作不可恢复。')) return;
    this.data = this.data.filter(d => d.id !== id);
    this.saveStorage();
    this.render();
    this.showToast('已删除', 'success');
  },

  exportData() {
    const blob = new Blob([JSON.stringify(this.data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `KF客服知识库备份_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
    this.showToast('备份文件已下载', 'success');
  },

  importData(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const imported = JSON.parse(e.target.result);
        if (!Array.isArray(imported)) throw new Error('格式错误');
        if (confirm(`确定导入 ${imported.length} 条知识？当前 ${this.data.length} 条数据将被覆盖。`)) {
          this.data = imported;
          this.saveStorage();
          this.render();
          this.showToast('导入成功', 'success');
        }
      } catch (err) {
        this.showToast('导入失败：文件格式不正确', 'error');
      }
      input.value = '';
    };
    reader.readAsText(file);
  },

  // ==================== Field Manager ====================
  openFieldManager() {
    if (!auth.isAdmin()) { this.showToast('仅管理员可管理字段', 'error'); return; }
    const body = document.getElementById('fieldBody');
    const renderGroup = (key, label) => {
      const arr = config.get(key);
      return `
        <div class="field-group">
          <h4>${label} <span class="count">(${arr.length}个)</span></h4>
          <div class="field-tags" id="fg-${key}">
            ${arr.map(v => `
              <span class="field-tag">${this.escapeHtml(v)}
                <button onclick="app.removeField('${key}', '${this.escapeHtml(v).replace(/'/g, "\\'")}')">&times;</button>
              </span>
            `).join('')}
          </div>
          <div class="field-add-row">
            <input type="text" id="fadd-${key}" placeholder="添加新的${label}..." onkeydown="if(event.key==='Enter')app.addField('${key}')">
            <button class="btn btn-primary btn-sm" onclick="app.addField('${key}')">添加</button>
          </div>
        </div>
      `;
    };
    body.innerHTML = `
      <p style="color:var(--muted);font-size:0.85rem;margin-bottom:1rem;">在此管理所有下拉选项字段。删除或添加会立即生效，并同步更新所有表单和筛选器。</p>
      ${renderGroup('categories', '产品品类')}
      ${renderGroup('questionTypes', '问题类型')}
      ${renderGroup('platforms', '平台')}
    `;
    document.getElementById('fieldModal').classList.add('active');
  },

  closeFieldManager() {
    document.getElementById('fieldModal').classList.remove('active');
  },
  // ==================== Profile Manager ====================
  openProfile() {
    if (!auth.isAdmin()) { this.showToast('仅管理员可修改个人资料', 'error'); return; }
    const savedUser = localStorage.getItem('zhuor_kb_admin_user') || 'Frank';
    document.getElementById('profileUser').value = savedUser;
    document.getElementById('profileNewPass').value = '';
    document.getElementById('profileConfirmPass').value = '';
    document.getElementById('profileModal').classList.add('active');
  },

  closeProfile() {
    document.getElementById('profileModal').classList.remove('active');
  },

  saveProfile() {
    const newUser = document.getElementById('profileUser').value.trim();
    const newPass = document.getElementById('profileNewPass').value;
    const confirmPass = document.getElementById('profileConfirmPass').value;
    if (!newUser) { this.showToast('用户名不能为空', 'error'); return; }
    if (newPass && newPass !== confirmPass) { this.showToast('两次输入的密码不一致', 'error'); return; }
    localStorage.setItem('zhuor_kb_admin_user', newUser);
    if (newPass) localStorage.setItem('zhuor_kb_admin_pass', newPass);
    sync.saveAdmin({ user: newUser, pass: newPass || localStorage.getItem('zhuor_kb_admin_pass') || 'Frank1215' });
    auth.applyUI();
    this.closeProfile();
    this.showToast('个人资料已更新', 'success');
  },


  addField(key) {
    const input = document.getElementById('fadd-' + key);
    const val = input.value.trim();
    if (!val) return;
    const arr = config.get(key);
    if (arr.includes(val)) { this.showToast('该选项已存在', 'error'); return; }
    arr.push(val);
    config.set(key, arr);
    config.refreshAll();
    this.openFieldManager(); // re-render
    this.showToast('添加成功', 'success');
  },

  removeField(key, val) {
    if (!confirm(`确定删除 "${val}" 吗？已使用该值的条目不会受影响，但下拉选项中将不再显示。`)) return;
    let arr = config.get(key);
    arr = arr.filter(v => v !== val);
    config.set(key, arr);
    config.refreshAll();
    this.openFieldManager();
    this.showToast('已删除', 'success');
  },


  // ==================== Room / Cloud ====================
  updateRoomDisplay() {
    const el = document.getElementById('roomBadge');
    if (el) el.textContent = '房间: ' + roomManager.getRoomId();
  },

  switchRoom() {
    const newRoom = prompt('请输入房间号（仅字母、数字、下划线、连字符）：', roomManager.getRoomId());
    if (!newRoom) return;
    if (roomManager.setRoomId(newRoom)) {
      sync.disconnect();
      location.href = location.pathname + '?room=' + roomManager.getRoomId();
    }
  },

  migrateLocalData() {
    if (!db) { this.showToast('Firebase 未配置，无法迁移', 'error'); return; }
    const localData = localStorage.getItem('zhuor_kb_data');
    if (!localData) { this.showToast('没有本地数据需要迁移', 'error'); return; }
    if (!confirm('确定将本地数据上传到当前房间「' + roomManager.getRoomId() + '」吗？这会覆盖云端现有数据。')) return;
    const data = JSON.parse(localData);
    sync.saveEntries(data).then(() => {
      this.showToast('本地数据已成功上传到云端', 'success');
    }).catch(err => {
      this.showToast('上传失败: ' + err.message, 'error');
    });
  },

  showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast toast-' + type + ' show';
    setTimeout(() => t.classList.remove('show'), 2500);
  }
};

// Close modals on outside click
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', (e) => {
    if (e.target === el && el.id !== 'loginOverlay') el.classList.remove('active');
  });
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.active').forEach(el => {
      if (el.id !== 'loginOverlay') el.classList.remove('active');
    });
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

// Init
app.init();
</script>
</body>
</html>
